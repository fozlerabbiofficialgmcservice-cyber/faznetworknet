services:
  - type: web
    name: faznetworknet
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ROUTER_HOST
        sync: false
      - key: ROUTER_PORT
        value: "8728"
      - key: ROUTER_USER
        sync: false
      - key: ROUTER_PASS
        sync: false
      - key: MACRODROID_WEBHOOK_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
